        this.updateProgressModal(`Re-encrypting file ${done} of ${items.length}…`);
      }
      const { iv, cipher } = await CryptoService.encryptBuffer(newKey, new TextEncoder().encode('VAULT_OK_v1'));
      await this.db.putMeta({ salt: newSalt, verifyIv: iv, verifyCipher: cipher, iterations: CryptoService.PBKDF2_ITERATIONS, failedAttempts: 0, lockUntil: 0, dataFormatVersion: 2 });
      this.security.activeKey = newKey;
      this.clearThumbCache();
      await this.vaultMgr.loadSession();
      this.hideProgressModal();
      this.toast('PIN changed successfully.');
      await this.renderGrid();
    }, 'Could not change PIN.');
    this.hideProgressModal();
  }

  /* ---------------- Export / Import ---------------- */
  async runExport(){
    this.showProgressModal('Exporting vault', 'Packaging your encrypted files…');
    await this.safe(async () => {
      const blob = await this.vaultMgr.exportVault((done, total) => this.updateProgressModal(`Packaging file ${done} of ${total}…`));
      this.hideProgressModal();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `vault-export-${Date.now()}.vault`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      this.toast('Vault exported.');
    }, 'Export failed.');
    this.hideProgressModal();
  }

  async runImportReplace(result){
    this.showProgressModal('Importing vault', 'Restoring encrypted files…');
    await this.safe(async () => {
      const { okCount, failCount } = await this.vaultMgr.replaceAllWithImport(
        result.reader, result.salt, result.iterations, result.verifyIv, result.verifyCipher,
        (done, total) => this.updateProgressModal(`Restoring file ${done} of ${total}…`)
      );
      this.hideProgressModal();
      this.security.lock();
      this.closeVault();
      this.toast(failCount > 0
        ? `Imported ${okCount} file(s). ${failCount} were skipped (corrupted). Vault is locked — enter the PIN to view it.`
        : `Imported ${okCount} file(s). Vault is locked — enter the PIN to view it.`);
    }, 'Import failed.');
    this.hideProgressModal();
  }

  /* ---------------- Generic progress / confirm modals ---------------- */
  showProgressModal(title, sub){
    this.hideProgressModal();
    const div = document.createElement('div');
    div.className = 'modal'; div.id = 'progressModal';
    div.innerHTML = `<div class="modal-card"><div class="spinner"></div><h3>${title}</h3><p id="progressSub">${sub}</p></div>`;
    document.body.appendChild(div);
  }
  updateProgressModal(sub){ const el = document.getElementById('progressSub'); if (el) el.textContent = sub; }
  hideProgressModal(){ const el = document.getElementById('progressModal'); if (el) el.remove(); }
  confirmModal(title, sub, confirmLabel, danger = true){
    return new Promise(resolve => {
      const div = document.createElement('div');
      div.className = 'modal';
      div.innerHTML = `<div class="modal-card"><h3>${title}</h3><p>${sub}</p>
        <div class="modal-actions"><button class="cancel">Cancel</button>
        <button class="confirm ${danger ? '' : 'safe'}">${confirmLabel}</button></div></div>`;
      document.body.appendChild(div);
      div.querySelector('.cancel').onclick = () => { div.remove(); resolve(false); };
      div.querySelector('.confirm').onclick = () => { div.remove(); resolve(true); };
    });
  }

  /* ---------------- Vault chrome ---------------- */
  bindVaultChrome(){
    this.vaultEl = document.getElementById('vault');
    this.gridEl = document.getElementById('grid');
    this.emptyEl = document.getElementById('emptyState');
    this.fileInput = document.getElementById('fileInput');
    this.importInput = document.getElementById('importInput');

    this.virtualGrid = new VirtualGrid({
      scrollEl: document.getElementById('vaultBody'),
      gridEl: this.gridEl,
      topSpacerEl: document.getElementById('topSpacer'),
      bottomSpacerEl: document.getElementById('bottomSpacer'),
      cols: 3, gap: 10,
      renderCell: (item) => this.buildCell(item)
    });

    document.getElementById('lockBtn').addEventListener('click', () => this.closeVault());
    document.getElementById('addBtn').addEventListener('click', () => { this.security.expectingBlur = true; this.fileInput.click(); });

    this.fileInput.addEventListener('change', async (e) => {
      this.security.expectingBlur = false;
      const files = e.target.files;
      if (files && files.length){
        this.showProgressModal('Adding files', `Encrypting file 1 of ${files.length}…`);
        let count = 0;
        const results = await this.safe(() => this.vaultMgr.importFiles(files, this.thumbService, () => {
          count++; this.updateProgressModal(`Encrypting file ${count} of ${files.length}…`);
        }), 'Import failed.') || [];
        this.hideProgressModal();
        const failed = results.filter(r => !r.ok);
        if (failed.length) this.toast(`${failed.length} file(s) failed to import.`);
        await this.renderGrid();
      }
      this.fileInput.value = '';
    });

    const menuBtn = document.getElementById('menuBtn');
    const menuPanel = document.getElementById('menuPanel');
    menuBtn.addEventListener('click', () => { menuPanel.style.display = menuPanel.style.display === 'none' ? 'block' : 'none'; });
    document.addEventListener('click', (e) => { if (!menuPanel.contains(e.target) && e.target !== menuBtn) menuPanel.style.display = 'none'; });
    document.getElementById('menuChangePin').addEventListener('click', () => { menuPanel.style.display = 'none'; this.openGate('changeOld'); });
    document.getElementById('menuExport').addEventListener('click', () => { menuPanel.style.display = 'none'; this.runExport(); });
    document.getElementById('menuImport').addEventListener('click', () => {
      menuPanel.style.display = 'none'; this.security.expectingBlur = true; this.importInput.click();
    });
    this.importInput.addEventListener('change', async (e) => {
      this.security.expectingBlur = false;
      const file = e.target.files[0];
      this.importInput.value = '';
      if (!file) return;
      await this.safe(async () => {
        const buf = new Uint8Array(await file.arrayBuffer());
        VaultPackager.parseHeader(buf); // throws early on bad magic / unsupported version / truncated header
        const proceed = await this.confirmModal('Import vault?', 'This will replace everything currently in this vault on this device. This cannot be undone.', 'Import', true);
        if (!proceed) return;
        this._pendingImport = { buf };
        this.openGate('importPin');
      }, 'Could not read that file.');
    });
    document.getElementById('menuDeleteAll').addEventListener('click', async () => {
      menuPanel.style.display = 'none';
      const proceed = await this.confirmModal('Delete all vault data?', 'Every photo, video, and your PIN will be permanently deleted from this device.', 'Delete everything', true);
      if (!proceed) return;
      await this.safe(async () => {
        await this.vaultMgr.deleteAllData();
        this.clearThumbCache();
        this.closeVault();
        this.toast('All vault data deleted.');
      }, 'Could not delete vault data.');
    });

    document.getElementById('searchInput').addEventListener('input', () => this.renderGrid());
    document.getElementById('sortSelect').addEventListener('change', () => this.renderGrid());
    document.getElementById('favFilterBtn').addEventListener('click', (e) => { e.target.classList.toggle('active'); this.renderGrid(); });

    const selectModeBtn = document.getElementById('selectModeBtn');
    const selectBar = document.getElementById('selectBar');
    selectModeBtn.addEventListener('click', () => {
      this.selectMode = !this.selectMode;
      this.selectedIds.clear();
      selectModeBtn.classList.toggle('active', this.selectMode);
      selectBar.style.display = this.selectMode ? 'flex' : 'none';
      this.updateSelectCount();
      this.renderGrid();
    });
    document.getElementById('cancelSelectBtn').addEventListener('click', () => selectModeBtn.click());
    document.getElementById('deleteSelectedBtn').addEventListener('click', async () => {
      if (this.selectedIds.size === 0) return;
      const proceed = await this.confirmModal('Delete selected files?', `${this.selectedIds.size} file(s) will be permanently deleted.`, 'Delete', true);
      if (!proceed) return;
      await this.safe(async () => {
        const ids = Array.from(this.selectedIds);
        await this.vaultMgr.deleteItems(ids);
        ids.forEach(id => this.releaseThumb(id));
        this.selectedIds.clear();
        this.updateSelectCount();
        await this.renderGrid();
      }, 'Could not delete the selected files.');
    });
  }

  updateSelectCount(){ document.getElementById('selectCount').textContent = `${this.selectedIds.size} selected`; }

  async enterVault(){
    await this.safe(async () => {
      await this.vaultMgr.loadSession();
      const migrated = await this.security.migrateLegacyItemsIfNeeded();
      if (migrated > 0) await this.vaultMgr.loadSession(); // reload after migration touched records
    }, 'Could not load the vault.');
    this.vaultEl.classList.add('open');
    await this.renderGrid();
  }
  closeVault(){
    this.vaultEl.classList.remove('open');
    this.security.lock();
    this.clearThumbCache();
    if (this.vaultMgr) this.vaultMgr.clearSessionCaches();
  }
  handleAutoLock(){
    if (this.vaultEl.classList.contains('open')) this.closeVault();
    this.closeViewer();
  }

  clearThumbCache(){
    this.thumbUrlCache.forEach(url => URL.revokeObjectURL(url));
    this.thumbUrlCache.clear();
  }
  releaseThumb(id){
    const url = this.thumbUrlCache.get(id);
    if (url){ URL.revokeObjectURL(url); this.thumbUrlCache.delete(id); }
    const fullUrl = this.thumbUrlCache.get('full:' + id);
    if (fullUrl){ URL.revokeObjectURL(fullUrl); this.thumbUrlCache.delete('full:' + id); }
  }

  /* ---------------- Grid rendering (virtualized) ---------------- */
  async renderGrid(){
    const search = document.getElementById('searchInput').value;
    const sort = document.getElementById('sortSelect').value;
    const favoritesOnly = document.getElementById('favFilterBtn').classList.contains('active');
    this.currentList = this.vaultMgr.getFiltered({ search, sort, favoritesOnly });

    if (this.currentList.length === 0){
      this.emptyEl.style.display = 'flex';
      this.gridEl.style.display = 'none';
      document.getElementById('topSpacer').style.height = '0px';
      document.getElementById('bottomSpacer').style.height = '0px';
      this.gridEl.innerHTML = '';
      return;
    }
    this.emptyEl.style.display = 'none';
    this.gridEl.style.display = 'grid';
    this.virtualGrid.setItems(this.currentList);
  }

  buildCell(item){
    const cell = document.createElement('div');
    cell.className = 'cell' + (this.selectMode ? ' selecting' : '') + (this.selectedIds.has(item.id) ? ' selected' : '') + (item.corrupted ? ' corrupted' : '');
    cell.dataset.id = item.id;

    const ph = document.createElement('div');
    ph.className = 'ph'; ph.textContent = item.corrupted ? '⚠' : (item.type === 'video' ? '🎬' : '🖼');
    cell.appendChild(ph);

    const kind = document.createElement('div');
    kind.className = 'kind'; kind.textContent = item.corrupted ? 'Damaged' : (item.type === 'video' ? 'Video' : 'Photo');
    cell.appendChild(kind);

    if (!item.corrupted){
      const star = document.createElement('button');
      star.className = 'star' + (item.favorite ? ' on' : '');
      star.textContent = item.favorite ? '★' : '☆';
      star.setAttribute('aria-label', 'Toggle favorite');
      star.addEventListener('click', (ev) => {
        ev.stopPropagation();
        this.safe(async () => {
          const fav = await this.vaultMgr.toggleFavorite(item.id);
          star.classList.toggle('on', fav); star.textContent = fav ? '★' : '☆';
        }, 'Could not update favorite.');
      });
      cell.appendChild(star);
    }

    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.setAttribute('aria-label', 'Delete');
    del.addEventListener('click', (ev) => {
      ev.stopPropagation();
      this.safe(async () => {
        await this.vaultMgr.deleteItems([item.id]);
        this.releaseThumb(item.id);
        await this.renderGrid();
      }, 'Could not delete this file.');
    });
    cell.appendChild(del);

    const check = document.createElement('div');
    check.className = 'check'; check.textContent = '✓';
    cell.appendChild(check);

    cell.addEventListener('click', () => {
      if (this.selectMode){
        if (this.selectedIds.has(item.id)) this.selectedIds.delete(item.id); else this.selectedIds.add(item.id);
        cell.classList.toggle('selected');
        this.updateSelectCount();
      } else if (!item.corrupted){
        this.openViewer(item.id);
      }
    });

    if (!item.corrupted) this.loadCellThumb(cell, item.id);
    return cell;
  }

  async loadCellThumb(cellEl, id){
    const cachedThumb = this.thumbUrlCache.get(id);
    if (cachedThumb){ this.paintThumb(cellEl, cachedThumb); return; }
    const cachedFull = this.thumbUrlCache.get('full:' + id);
    if (cachedFull){ this.paintFullFallback(cellEl, cachedFull, id); return; }

    const raw = this.vaultMgr._rawFor(id);
    if (raw && raw.thumb){
      try {
        const url = await this.vaultMgr.decryptThumbnail(id);
        if (url){
          if (!document.body.contains(cellEl) || Number(cellEl.dataset.id) !== id){ URL.revokeObjectURL(url); return; }
          this.thumbUrlCache.set(id, url);
          this.paintThumb(cellEl, url);
          return;
        }
        dbg('thumbnail decrypt returned no url for item', id);
      } catch (e) {
        dbg('thumbnail decrypt failed for item', id, ':', e.message);
      }
    } else {
      dbg('no stored thumbnail for item', id, '- using full-original fallback');
    }
    // No usable pre-made thumbnail (missing, corrupted, or failed to decrypt) -
    // fall back to decrypting the original file directly rather than showing nothing useful.
    await this.renderFullFallback(cellEl, id);
  }

  paintThumb(cellEl, url){
    if (cellEl.querySelector('.thumb')) return;
    const img = document.createElement('img');
    img.className = 'thumb'; img.loading = 'lazy';
    img.onerror = () => {
      dbg('thumbnail <img> failed to render for item', Number(cellEl.dataset.id), '- falling back to original');
      img.remove();
      this.renderFullFallback(cellEl, Number(cellEl.dataset.id));
    };
    img.src = url;
    cellEl.insertBefore(img, cellEl.firstChild);
    const ph = cellEl.querySelector('.ph');
    if (ph) ph.remove();
  }

  // Last-resort display path: no usable pre-generated thumbnail exists for this item
  // (generation failed, or the stored thumbnail itself won't render), so decrypt the
  // original photo/video and display that directly instead of a black or blank card.
  // Cached separately from real thumbnails so repeated scrolling doesn't re-decrypt.
  async renderFullFallback(cellEl, id){
    const cachedFull = this.thumbUrlCache.get('full:' + id);
    if (cachedFull){ this.paintFullFallback(cellEl, cachedFull, id); return; }
    try {
      const url = await this.vaultMgr.decryptFull(id);
      if (!document.body.contains(cellEl) || Number(cellEl.dataset.id) !== id){ URL.revokeObjectURL(url); return; }
      this.thumbUrlCache.set('full:' + id, url);
      this.paintFullFallback(cellEl, url, id);
      dbg('fallback: rendered original file for item', id);
    } catch (e) {
      dbg('fallback: decrypting the original also failed for item', id, ':', e && e.message);
      // Nothing left to try - the placeholder glyph (.ph) stays visible, never a black card.
    }
  }
  paintFullFallback(cellEl, url, id){
    if (cellEl.querySelector('.thumb')) return;
    const meta = this.vaultMgr.metaIndex ? this.vaultMgr.metaIndex.get(id) : null;
    const isVideo = !!(meta && meta.type === 'video');
    const el = document.createElement(isVideo ? 'video' : 'img');
    el.className = 'thumb';
    if (isVideo){ el.muted = true; el.playsInline = true; el.preload = 'metadata'; }
    else {
      el.loading = 'lazy';
      // If even the blob: URL fails to render here, this environment likely restricts
      // blob: as a media source - retry once as a base64 data: URL before giving up.
      el.onerror = () => this._retryFullFallbackAsDataUrl(cellEl, id, el);
    }
    el.src = url;
    cellEl.insertBefore(el, cellEl.firstChild);
    const ph = cellEl.querySelector('.ph');
    if (ph) ph.remove();
  }

  async _retryFullFallbackAsDataUrl(cellEl, id, oldEl){
    if (oldEl.dataset.dataUrlTried) return; // avoid a retry loop if the data URL also errors
    oldEl.dataset.dataUrlTried = '1';
    dbg('full-fallback blob URL failed to render for item', id, '- retrying as a data URL');
    try {
      const dataUrl = await this.vaultMgr.decryptFullAsDataUrl(id);
      if (!document.body.contains(cellEl) || Number(cellEl.dataset.id) !== id) return;
      oldEl.src = dataUrl;
      dbg('full-fallback data URL succeeded for item', id);
    } catch (e) {
      dbg('full-fallback data URL also failed for item', id, ':', e && e.message);
      if (document.body.contains(oldEl)) oldEl.remove();
      if (!cellEl.querySelector('.ph') && !cellEl.querySelector('.thumb')){
        const ph = document.createElement('div');
        ph.className = 'ph'; ph.textContent = '🖼';
        cellEl.insertBefore(ph, cellEl.firstChild);
      }
    }
  }

  /* ---------------- Fullscreen viewer ---------------- */
  bindViewer(){
    this.viewerEl = document.getElementById('viewer');
    this.viewerWrap = document.getElementById('viewerMediaWrap');
    document.getElementById('viewerClose').addEventListener('click', () => this.closeViewer());
    document.getElementById('viewerPrev').addEventListener('click', () => this.navViewer(-1));
    document.getElementById('viewerNext').addEventListener('click', () => this.navViewer(1));
    document.getElementById('viewerRotate').addEventListener('click', () => {
      this.rotateDeg = (this.rotateDeg + 90) % 360;
      this.applyZoom();
    });
    document.getElementById('viewerFullscreen').addEventListener('click', () => {
      const el = this.viewerEl;
      const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (req) req.call(el).catch(() => this.toast('Fullscreen is not available.'));
    });
    document.getElementById('viewerDelete').addEventListener('click', async () => {
      const item = this.currentList[this.viewerIndex];
      if (!item) return;
      const proceed = await this.confirmModal('Delete this file?', 'This cannot be undone.', 'Delete', true);
      if (!proceed) return;
      await this.safe(async () => {
        await this.vaultMgr.deleteItems([item.id]);
        this.releaseThumb(item.id);
        await this.renderGrid();
        if (this.currentList.length === 0){ this.closeViewer(); return; }
        this.viewerIndex = Math.min(this.viewerIndex, this.currentList.length - 1);
        this.showViewerItem(this.viewerIndex);
      }, 'Could not delete this file.');
    });
    document.getElementById('viewerFav').addEventListener('click', async (e) => {
      const item = this.currentList[this.viewerIndex];
      if (!item) return;
      await this.safe(async () => {
        const fav = await this.vaultMgr.toggleFavorite(item.id);
        item.favorite = fav; e.target.textContent = fav ? '★' : '☆';
      }, 'Could not update favorite.');
    });

    this.viewerWrap.addEventListener('pointerdown', (e) => this.onPointerDown(e));
    this.viewerWrap.addEventListener('pointermove', (e) => this.onPointerMove(e));
    this.viewerWrap.addEventListener('pointerup', (e) => this.onPointerUp(e));
    this.viewerWrap.addEventListener('pointercancel', (e) => this.onPointerUp(e));
    this.viewerWrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.zoomScale = Math.min(4, Math.max(1, this.zoomScale - e.deltaY * 0.0015));
      this.applyZoom();
    }, { passive: false });
    this.viewerWrap.addEventListener('dblclick', () => {
      this.zoomScale = this.zoomScale > 1 ? 1 : 2.5;
      this.panX = 0; this.panY = 0;
      this.applyZoom();
    });
  }

  bindKeyboard(){
    document.addEventListener('keydown', (e) => {
      if (this.viewerEl.classList.contains('open')){
        if (e.key === 'Escape') this.closeViewer();
        if (e.key === 'ArrowLeft') this.navViewer(-1);
        if (e.key === 'ArrowRight') this.navViewer(1);
        if (e.key === '+' || e.key === '='){ this.zoomScale = Math.min(4, this.zoomScale + 0.25); this.applyZoom(); }
        if (e.key === '-'){ this.zoomScale = Math.max(1, this.zoomScale - 0.25); this.applyZoom(); }
      } else if (this.gateEl.classList.contains('open')){
        if (e.key === 'Escape') this.closeGate();
      }
    });
  }

  onPointerDown(e){
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pointers.size === 1){
      this.dragging = true; this.dragStartX = e.clientX; this.dragStartY = e.clientY;
      this.dragStartPanX = this.panX; this.dragStartPanY = this.panY;
    } else if (this.pointers.size === 2){
      const pts = Array.from(this.pointers.values());
      this.pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      this.pinchStartScale = this.zoomScale;
    }
  }
  onPointerMove(e){
    if (!this.pointers.has(e.pointerId)) return;
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pointers.size === 2){
      const pts = Array.from(this.pointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      this.zoomScale = Math.min(4, Math.max(1, this.pinchStartScale * (dist / (this.pinchStartDist || 1))));
      this.applyZoom();
    } else if (this.pointers.size === 1 && this.dragging){
      const dx = e.clientX - this.dragStartX, dy = e.clientY - this.dragStartY;
      if (this.zoomScale > 1.02){ this.panX = this.dragStartPanX + dx; this.panY = this.dragStartPanY + dy; this.applyZoom(); }
    }
  }
  onPointerUp(e){
    if (this.pointers.size === 1 && this.zoomScale <= 1.02 && this.dragging){
      const dx = e.clientX - this.dragStartX;
      if (Math.abs(dx) > 60) this.navViewer(dx > 0 ? -1 : 1);
    }
    this.pointers.delete(e.pointerId);
    this.dragging = this.pointers.size > 0;
  }
  applyZoom(){
    const media = this.viewerWrap.querySelector('.viewer-media');
    if (!media) return;
    media.style.transform = `translate(${this.panX}px, ${this.panY}px) scale(${this.zoomScale}) rotate(${this.rotateDeg}deg)`;
  }

  async openViewer(id){
    const idx = this.currentList.findIndex(i => i.id === id);
    if (idx === -1) return;
    this.viewerIndex = idx;
    this.viewerEl.classList.add('open');
    await this.showViewerItem(idx);
  }
  async showViewerItem(idx){
    this.releaseViewerUrl();
    this.zoomScale = 1; this.panX = 0; this.panY = 0; this.rotateDeg = 0;
    const item = this.currentList[idx];
    this.viewerWrap.innerHTML = '<div class="viewer-loading">Decrypting…</div>';
    document.getElementById('viewerFav').textContent = item.favorite ? '★' : '☆';
    let rendered = false;
    await this.safe(async () => {
      if (item.type === 'video'){
        const url = await this.vaultMgr.decryptFull(item.id); // blob: URL - better for large files
        this.viewerUrl = url;
        this.viewerWrap.innerHTML = '';
        const media = document.createElement('video');
        media.className = 'viewer-media'; media.controls = true; media.autoplay = true;
        media.onerror = () => {
          dbg('viewer blob URL failed for video item', item.id, '- retrying as a data URL');
          this._retryViewerVideoAsDataUrl(item.id, media);
        };
        media.src = url;
        this.viewerWrap.appendChild(media);
      } else {
        // Images: decrypt straight to a base64 data: URL - the same fix already applied
        // to thumbnails, since this environment appears to block blob: URLs as media sources.
        const url = await this.vaultMgr.decryptFullAsDataUrl(item.id);
        this.viewerWrap.innerHTML = '';
        const media = document.createElement('img');
        media.className = 'viewer-media';
        media.src = url;
        this.viewerWrap.appendChild(media);
      }
      rendered = true;
    }, 'Could not decrypt this file.');
    if (!rendered) this.viewerWrap.innerHTML = '<div class="viewer-loading">Could not decrypt this file.</div>';
  }
  async _retryViewerVideoAsDataUrl(id, videoEl){
    try {
      const dataUrl = await this.vaultMgr.decryptFullAsDataUrl(id);
      videoEl.src = dataUrl;
      dbg('viewer data URL succeeded for video item', id);
    } catch (e) {
      dbg('viewer data URL also failed for video item', id, ':', e && e.message);
      this.viewerWrap.innerHTML = '<div class="viewer-loading">Could not display this video in this environment.</div>';
    }
  }
  navViewer(dir){
    if (this.currentList.length === 0) return;
    this.viewerIndex = (this.viewerIndex + dir + this.currentList.length) % this.currentList.length;
    this.showViewerItem(this.viewerIndex);
  }
  releaseViewerUrl(){
    if (this.viewerUrl){ URL.revokeObjectURL(this.viewerUrl); this.viewerUrl = null; }
  }
  closeViewer(){
    if (document.fullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
    this.viewerEl.classList.remove('open');
    this.releaseViewerUrl();
    this.viewerWrap.innerHTML = '';
    this.viewerIndex = -1;
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const ui = new UIController();
  ui.init().catch(e => console.error('Vault init failed', e));
});

})();
</script>
</body>
